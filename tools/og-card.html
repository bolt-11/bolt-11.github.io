<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source — regenerate assets/og.png at 1200x630</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    font-family: "JetBrains Mono", monospace;
    display: grid; grid-template-columns: 380px 1fr;
    background: #181312; color: #f0e6dd;
  }
  .plate {
    background: #d9906f; color: #1a100d;
    padding: 38px 34px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .name { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .role { margin-top: 10px; font-size: 15px; line-height: 1.5; opacity: .82; }
  .links { font-size: 13px; line-height: 2.1; opacity: .85; border-top: 1px solid rgba(26,16,13,.22); padding-top: 12px; }
  .links span { display: block; border-bottom: 1px solid rgba(26,16,13,.18); padding-bottom: 4px; }

  .deck { padding: 34px 36px 30px; display: flex; flex-direction: column; gap: 18px; }
  .panel { position: relative; height: 150px; border: 1px solid #332b27; }
  .panel canvas { display: block; width: 100%; height: 100%; }
  .tag {
    position: absolute; left: 12px; bottom: 12px;
    display: flex; align-items: baseline; gap: 10px;
    padding: 6px 11px 7px;
    background: #181312; border: 1px solid #332b27;
  }
  .tag b { font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: #f0b08f; }
  .tag span { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #a89a8e; }

  .facts { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #a89a8e; }
  .facts span { padding-right: 12px; margin-right: 12px; border-right: 1px solid #332b27; }
  .rows { display: grid; }
  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 0; border-top: 1px solid #2b2420;
    font-size: 18px; color: #f0e6dd;
  }
  .row span:last-child { font-size: 13px; color: #a89a8e; letter-spacing: .1em; }
  .foot {
    margin-top: auto; display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid #332b27; padding-top: 14px;
    font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #a89a8e;
  }
  .foot .exit { color: #f0b08f; }
</style>
</head>
<body>
  <div class="plate">
    <div>
      <div class="name">fadli darusalam</div>
      <div class="role">penetration tester<br>applications &amp; networks</div>
    </div>
    <div class="links">
      <span>fdldarusalam11@gmail.com</span>
      <span>github.com/bolt-11</span>
      <span>medium.com/@b0ltzzz</span>
    </div>
  </div>

  <div class="deck">
    <div class="panel">
      <canvas id="rain" width="710" height="150"></canvas>
      <div class="tag"><b>b0ltzzz</b></div>
    </div>

    <div class="facts">
      <span>02 proof-of-concepts</span><span>01 write-up</span><span>ctf pending</span>
    </div>
    <div class="rows">
      <div class="row"><span>tap-rush</span><span>2026</span></div>
      <div class="row"><span>tapjacker</span><span>2026</span></div>
    </div>
    <div class="foot">
      <span>indonesia · utc+7</span>
      <span class="exit">[exit 0]</span>
    </div>
  </div>

<script>
  (function () {
    var cv = document.getElementById('rain');
    var ctx = cv.getContext('2d');
    var w = cv.width, h = cv.height;
    var rgb = '240, 176, 143';
    var CHARS = '0123456789abcdef:/.<>=@#$%&*[]{}';
    var COL_W = 15, ROW_H = 15, TRAIL = 9;

    ctx.font = '500 11px "JetBrains Mono", monospace';
    ctx.textBaseline = 'top';

    function draw() {
      ctx.clearRect(0, 0, w, h);
      var cols = Math.floor(w / COL_W);

      for (var i = 0; i < cols; i++) {
        var x = 8 + i * COL_W;
        var head = 1 + ((i * 5) % Math.max(1, Math.floor(h / ROW_H) - 1));

        for (var t = 0; t < TRAIL; t++) {
          var row = head - t;
          if (row < 0) continue;
          var y = row * ROW_H;
          if (y > h) continue;

          var ch = CHARS.charAt((i * 7 + row * 3) % CHARS.length);
          var fade = Math.pow(1 - t / TRAIL, 1.6);
          var alpha = t === 0 ? 0.95 : 0.06 + fade * 0.5;

          ctx.fillStyle = 'rgba(' + rgb + ', ' + alpha.toFixed(3) + ')';
          ctx.fillText(ch, x, y);
        }
      }
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(draw);
    } else {
      draw();
    }
  })();
</script>
</body>
</html>
